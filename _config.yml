The Site Configuration
Import the theme
theme: jekyll-theme-chirpy
The language of the webpage › http://www.lingoes.net/en/translator/langcode.htm
If it has the same name as one of the files in folder _data/locales, the layout language will also be changed,
otherwise, the layout language will use the default value of 'en'.
lang: en
Change to your timezone › https://zones.arilyn.cc
timezone: Africa/Nairobi
jekyll-seo-tag settings › https://github.com/jekyll/jekyll-seo-tag/blob/master/docs/usage.md
↓ --------------------------
title: "Bildard Blair" # the main title
tagline: Cybersecurity Analyst | Network Engineer # it will display as the subtitle
description: "My journey as a cybersecurity Enthusiast"
Fill in the protocol & hostname for your site.
E.g. 'https://username.github.io', note that it does not end with a '/'.
url: "https://blair606.github.io/"
github: username: https://github.com/Blair606 # change to your GitHub username
twitter: username: https://x.com/BobbyZiggler
# change to your Twitter username
social: # Change to your full name. # It will be displayed as the default author of the posts and the copyright owner in the Footer name: Bildard Blair Odhiambo email: bobbyziggler606@gmail.com # change to your email address fediverse_handle: # fill in your fediverse handle. E.g. "@username@domain.com" links: # The first element serves as the copyright owner's link - https://x.com/BobbyZiggler # change to your Twitter homepage - https://github.com/Blair606 # change to your GitHub homepage # Uncomment below to add more social links # - https://www.facebook.com/username # - https://www.linkedin.com/in/username
Site Verification Settings
webmaster_verifications: google: # fill in your Google verification code bing: # fill in your Bing verification code alexa: # fill in your Alexa verification code yandex: # fill in your Yandex verification code baidu: # fill in your Baidu verification code facebook: # fill in your Facebook verification code
↑ --------------------------
The end of jekyll-seo-tag settings
Web Analytics Settings
analytics: google: id: # fill in your Google Analytics ID goatcounter: id: # fill in your GoatCounter ID umami: id: # fill in your Umami ID domain: # fill in your Umami domain matomo: id: # fill in your Matomo ID domain: # fill in your Matomo domain cloudflare: id: # fill in your Cloudflare Web Analytics token fathom: id: # fill in your Fathom Site ID
Page views settings
pageviews: provider: # now only supports 'goatcounter'
Prefer color scheme setting.
#
Note: Keep empty will follow the system prefer color by default,
and there will be a toggle to switch the theme between dark and light
on the bottom left of the sidebar.
#
Available options:
#
light — Use the light color scheme
dark — Use the dark color scheme
# theme_mode: # [light | dark]
The CDN endpoint for media resources.
Notice that once it is assigned, the CDN url
will be added to all media resources (site avatar, posts' images, audio and video files) paths starting with '/'
#
e.g. 'https://cdn.com'
cdn:
the avatar on sidebar, support local or CORS resources
avatar:
The URL of the site-wide social preview image used in SEO og:image meta tag.
It can be overridden by a customized page.image in front matter.
socialpreviewimage: # string, local or CORS resources
boolean type, the global switch for TOC in posts.
toc: true
actions: # Display "Edit this post" action on each post page to encourage contributions. editpost: enabled: false # set to true to display the "Edit this post" action. url: "" # repository base URL, e.g. https://github.com/cotes2020/jekyll-theme-chirpy/edit/master # Use dynamic or static URL for the edit link. # If static_url is false, the post's path will be appended to the url above as the final edit link. # Set to true if the URL should remain unchanged, which means each post will share the same edit link. staticurl: false # [ true | false ]
comments: # Global switch for the post-comment system. Keeping it empty means disabled. provider: # [disqus | utterances | giscus] # The provider options are as follows: disqus: shortname: # fill with the Disqus shortname. › https://help.disqus.com/en/articles/1717111-what-s-a-shortname # utterances settings › https://utteranc.es/ utterances: repo: # / issueterm: # < url | pathname | title | …> # Giscus options › https://giscus.app giscus: repo: # / repoid: category: categoryid: mapping: # optional, default to 'pathname' strict: # optional, default to '0' inputposition: # optional, default to 'bottom' lang: # optional, default to the value of site.lang reactions_enabled: # optional, default to the value of 1
Self-hosted static assets, optional › https://github.com/cotes2020/chirpy-static-assets
assets: self_host: enabled: # boolean, keep empty means false # specify the Jekyll environment, empty means both # only works if assets.self_host.enabled is 'true' env: # [development | production]
pwa: enabled: true # The option for PWA feature (installable) cache: enabled: true # The option for PWA offline cache # Paths defined here will be excluded from the PWA cache. # Usually its value is the baseurl of another website that # shares the same domain name as the current website. deny_paths: # - "/example" # URLs match <SITE_URL>/example/* will not be cached by the PWA
paginate: 10
The base URL of your site
baseurl: ""
