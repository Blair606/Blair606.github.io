kramdown: footnotebacklink: "↩︎" syntaxhighlighter: rouge syntaxhighlighteropts: # Rouge Options › https://github.com/jneen/rouge#full-options cssclass: highlight # defaultlang: console span: linenumbers: false block: linenumbers: true start_line: 1
collections: tabs: output: true sort_by: order
defaults:
